<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Don't Open! 😼</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
    <style>
        body {
            background-color: #E0F7FA;
            text-align: center;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>
    <header class="header-banner">
        <h1>Saif Ahmed</h1>
            <nav>
                <ul>
                    <li><a href="./index.html">Home page</a></li>
                    <li><a href="./about.html">About</a></li>
                    <li><a href="./contact.html">Contact</a></li>
                    <li><a href="./now.html">Don't Open! 😼</a></li>
                </ul>
    </header>

    <main>
        <h2>Click the Cat as many times as you can!</h2>
        <p>Time left: <span id="time">10</span> seconds | Score: <span id="score">0</span></p>
        <div id="gameArea">
            <img src="githubPFP.png" id="cat" alt="Cat">
        </div>
        <button id="startBtn" class="btn color-button mt-3">Start Game</button>
        <!-- Added Reset button -->
        <button id="resetBtn" class="btn color-button mt-3 ms-2">Reset Score</button>
    </main>

    <footer class="footer-banner text-center">
        <P>Have fun 😸</P>
        <P>Copyright &#169; Saif Ahmed 2025</P>
    </footer>

    <script>
        const cat = document.getElementById('cat');
        const gameArea = document.getElementById('gameArea');
        const scoreEl = document.getElementById('score');
        const timeEl = document.getElementById('time');
        const startBtn = document.getElementById('startBtn');
        const resetBtn = document.getElementById('resetBtn'); // reset button

        let score = 0;
        let time = 10;
        let gameInterval;

        function moveCat() {
            const maxX = gameArea.clientWidth - cat.clientWidth;
            const maxY = gameArea.clientHeight - cat.clientHeight;
            const x = Math.random() * maxX;
            const y = Math.random() * maxY;
            cat.style.left = x + 'px';
            cat.style.top = y + 'px';
        }

        cat.addEventListener('click', () => {
            score++;
            scoreEl.textContent = score;
            moveCat();
        });

        startBtn.addEventListener('click', () => {
            score = 0;
            time = 10;
            scoreEl.textContent = score;
            timeEl.textContent = time;
            moveCat();
            startBtn.disabled = true;

            gameInterval = setInterval(() => {
                time--;
                timeEl.textContent = time;
                if (time <= 0) {
                    clearInterval(gameInterval);
                    alert('Game over! Your score: ' + score);
                    startBtn.disabled = false;
                }
            }, 1000);
        });

        // Reset Score functionality
        resetBtn.addEventListener('click', () => {
            score = 0;
            scoreEl.textContent = score;
        });
    </script>
</body>
</html>
