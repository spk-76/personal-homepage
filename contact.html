<!DOCTYPE html>
<html lang="en">

<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="styles.css" rel="stylesheet">
    <title>Contact - Saif Ahmed</title>
</head>

<body>
    <header class="header-banner">
        <div class="container text-center py-4">
            <h1>Saif Ahmed</h1>
            <nav>
                <ul>
                    <li><a href="./index.html">Home page</a></li>
                    <li><a href="./about.html">About</a></li>
                    <li><a href="./contact.html">Contact</a></li>
                    <li><a href="./now.html">Don't Open! 😼</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="container my-5">
            <h1 class="text-center mb-4">Contact Me</h1>
            <form>
                <!-- Name -->
                <div class="mb-3">
                    <label for="nameInput" class="form-label">Your Name</label>
                    <input type="text" class="form-control" id="nameInput" placeholder="Your name">
                </div>

                <!-- Email -->
                <div class="mb-3">
                    <label for="emailInput" class="form-label">Your Email</label>
                    <input type="email" class="form-control" id="emailInput" placeholder="you@example.com" required>
                    <div class="form-text">We'll never share your email with anyone else.</div>
                </div>

                <!-- Message -->
                <div class="mb-3">
                    <label for="messageInput" class="form-label">Your Message</label>
                    <textarea class="form-control" id="messageInput" rows="5" placeholder="Write your message here..." required></textarea>
                </div>

                <!-- Optional fun checkbox -->
                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="exampleCheck1">
                    <label class="form-check-label" for="exampleCheck1">Check me out just for fun! 🐱💻</label>
                </div>

                <!-- Submit -->
                <button type="submit" class="btn color-button">Send Message</button>
            </form>

            <!-- Your email as reference -->
            <p class="text-center mt-4">   Or email me directly at: <a href="mailto:saifah645@gmail.com" class="text-decoration-none text-primary"> saifah645@gmail.com </a> </p>
        </section>
    </main>

    <footer class="footer-banner text-center py-3">
        Copyright &#169; Saif Ahmed 2025
    </footer>
    <script>
    // Select the form
    const form = document.querySelector('form');

    // Listen for submit event
    form.addEventListener('submit', function(event) {
        event.preventDefault(); // Prevent actual page reload

        // Show alert
        alert('Thank you! Your message has been submitted.');

        // Optional: clear the form fields
        form.reset();
    });
</script>

</body>
</html>
